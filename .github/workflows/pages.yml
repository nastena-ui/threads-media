name: Deploy Red Tent site

on:
  push:
    branches: [main]
    paths: ['krasny-shater-sait/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: krasny-shater-sait/package-lock.json
      - run: npm ci
        working-directory: krasny-shater-sait
      - run: npm run build
        working-directory: krasny-shater-sait
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: krasny-shater-sait/dist
      - id: deployment
        uses: actions/deploy-pages@v4
